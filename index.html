<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Gyne-Wheel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'IBM Plex Sans Thai Looped', sans-serif; 
            background: #f0f2f5; 
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
        }
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        input {
            -webkit-user-select: auto;
            user-select: auto;
        }
        
        .main-wrapper { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 60px; 
            width: 100%;
            max-width: 1200px; 
            align-items: flex-start; 
            padding-top: 40px; 
        }

        .form-card { 
            width: 400px; 
            background: white; 
            padding: 30px; 
            border-radius: 0 12px 0 0; 
            box-shadow: 8px 8px 24px rgba(149, 157, 165, 0.2); 
            box-sizing: border-box;
            height: 100vh; 
            min-height: fit-content; 
            margin: 0; 
        }

        .wheel-card { 
            padding: 30px; 
            box-sizing: border-box;
            position: sticky;       
            top: 70px;              
            align-self: flex-start; 
            margin-left: 20px; 
        }

        input, button { 
            display: block; 
            width: 100%; 
            max-width: 100%;
            margin: 8px 0; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #ccc; 
            cursor: pointer; 
            font-family: 'IBM Plex Sans Thai Looped', sans-serif; 
            box-sizing: border-box; 
            -webkit-appearance: none; 
            -moz-appearance: none;
            appearance: none;
            background-color: #fff;
            font-size: 16px; 
        }
        
        .wheel-container { 
            position: relative; 
            width: 600px; 
            height: 600px; 
            border-radius: 50%; 
            box-shadow: 0px 15px 35px rgba(0, 0, 0, 0.15), inset 0px -5px 15px rgba(0,0,0,0.05); 
            flex-shrink: 0; 
            min-width: 600px; 
        }

        #base {
            position: relative;
            z-index: 1;
        }

        #needles {
            position: absolute;
            top: 0;
            left: 0;
            width: 600px;
            height: 600px;
            z-index: 2; 
        }
        
        .needle {
            position: absolute;
            width: 20px;
            height: 350px; 
            left: 290px;
            top: -50px; 
            transform-origin: bottom center; 
            transition: transform 1.5s ease-out, opacity 0.5s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
        }
        
        .date-box { 
            margin-bottom: 5px; 
            padding: 4px; 
            background: #fff; 
            border: 1px solid #000; 
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: bold; 
            white-space: nowrap;
            transform-origin: center center;
            position: relative;
            z-index: 20; 
        }
        
        .needle-bar {
            width: 18px;              
            height: 320px;
            display: flex;
            justify-content: center;  
            align-items: center;      
            color: rgb(14, 13, 13);
            font-size: 12px;          
            font-weight: bold;
            border-radius: 5px;       
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2); 
            position: relative;
            z-index: 10;
        }

        /* ⚡ กล่องสำหรับหมุนเฉพาะข้อความ ⚡ */
        .text-content {
            display: inline-block;
            transition: transform 0.3s ease;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        
        #center-pivot {
            position: absolute;
            width: 200px;          
            height: auto;
            left: 50%;         
            top: 50%; 
            transform: translate(-50%,-50%);
            z-index: 100; 
            object-fit: cover;
            filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.3)); 
        }

        .res-box { margin-top: 20px; padding: 15px; border-radius: 8px; border: 1px solid #ccc; background: #f9fafb; display: none; box-sizing: border-box; width: 100%; }
        .res-item { border-radius: 5px; padding: 8px; margin: 5px 0; box-sizing: border-box; width: 100%; }
        .warning-banner { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; border: 2px solid #fca5a5; font-weight: bold; margin-bottom: 10px; text-align: center; box-sizing: border-box; width: 100%; }
        .side-effects-layout { display: none; width: 100%; margin-top: 20px; padding: 15px; background: #fff; border-left: 5px solid #ef4444; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.05); color: #475569; font-size: 14px; line-height: 1.6; box-sizing: border-box; }
        .option-box { background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px; border-radius: 8px; margin: 15px 0; box-sizing: border-box; }
        .embossed-text { width: 100%; text-align: right; margin-top: 20px; margin-bottom: 20px; padding-right: 15px; font-size: 13px; font-weight: 500; color: #94a3b8; letter-spacing: 0.5px; box-sizing: border-box; }

        #n-orange { z-index: 10 !important; }
        #n-magenta { z-index: 9 !important; }

        @media (max-width: 1024px) {
            body { padding: 20px; }
            .main-wrapper { flex-direction: column; align-items: center; gap: 30px; padding-top: 20px; }
            .form-card { width: 100%; max-width: 500px; height: auto; border-radius: 12px; }
            .wheel-card { width: 100%; margin-left: 0; position: relative; top: 0; padding: 0; display: flex; justify-content: center; transform: scale(0.7); transform-origin: top center; height: 450px; }
        }
        @media (max-width: 500px) {
            .wheel-card { transform: scale(0.55); height: 350px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="main-wrapper">
    
    <div class="form-card">
        <h2 style="margin-top: 0; color: #002d62;">Gyne-Wheel </h2>
        <label>น้ำหนักตัว (kg):</label><input type="number" id="w" value="50">
        
        <label>วันที่ประจำเดือนมาปกติ:</label><input type="date" id="p-date" onchange="updateTDate()">
        
        <div class="option-box">
            <label style="color:#0369a1; font-weight:600;">ต้องการเลื่อนออกไป (จำนวนวัน):</label>
            <input type="number" id="delay-days" placeholder="เช่น 5" oninput="updateTDate()" style="margin-bottom: 4px;">
            
            <div style="text-align:center; font-size:12px; color:#64748b; margin: 8px 0;">--- หรือ ---</div>
            
            <label style="color:#0369a1; font-weight:600;">เลือกวันที่ต้องการให้มา:</label>
            <input type="date" id="t-date" onchange="updateDelayDays()" style="margin-top: 4px;">
        </div>
        
        <button onclick="phase1()" style="background:#002d62; color:white;font-weight:600; padding: 15px;">ขั้นที่ 1: ช่วงเวลาที่ควรรับประทานยา</button>
        <div id="gold-window" style="font-weight:600; color:#002d62; margin:18px 0; text-align: center;"></div>
        
        <div id="p2" style="display:none; border-top:1px solid #ccc; padding-top:20px; margin-top: 15px;">
            <label>เลือกวันเริ่มรับประทานยาจริง:</label><input type="date" id="s-actual">
            <button onclick="phase2()" style="background:#002d62; color:white;font-weight:600; padding: 15px;">ขั้นที่ 2: สรุปผลการจ่ายยา</button>
        </div>
        
        <div id="res" class="res-box"></div>
        
        <div id="side-effects-box" class="side-effects-layout">
            <b style="color:#ef4444;">⚠️ ข้อควรระวัง/อาการข้างเคียง:</b><br>
            คลื่นไส้ อาเจียน วิงเวียนศีรษะ คัดตึงเต้านม และอาจมีเลือดออกกะปริบกะปรอย
        </div>
        <div class="embossed-text">
            Created by Piriyapan Songvirat
        </div>
    </div>

    <div class="wheel-card">
        <div class="wheel-container">
            <svg viewBox="0 0 600 600" id="base" style="width:100%; height:100%; border-radius: 50%;">
                <circle cx="300" cy="300" r="280" fill="rgb(255, 212, 222)" stroke="white" stroke-width="4"/>
            </svg>
            <div id="needles">
                <div id="n-green" class="needle"><div class="date-box" id="d-green"></div><div class="needle-bar" style="background:#002d62;color:rgb(251, 249, 249)"><div class="text-content">5 วันก่อนประจำเดือนมา</div></div></div>
                <div id="n-yellow" class="needle"><div class="date-box" id="d-yellow"></div><div class="needle-bar" style="background:hsl(212, 99%, 30%); color:rgb(251, 249, 249)"><div class="text-content">3 วันก่อนประจำเดือนมา</div></div></div>
                <div id="n-red" class="needle"><div class="date-box" id="d-red"></div><div class="needle-bar" style="background:#ca5160;color:rgb(251, 249, 249)"><div class="text-content">วันที่ประจำเดือนมาปกติ</div></div></div>
                <div id="n-cyan" class="needle"><div class="date-box" id="d-cyan"></div><div class="needle-bar" style="background:#01796F; color:rgb(255, 255, 255)"><div class="text-content">เริ่มรับประทานยาจริง</div></div></div>
                
                <div id="n-orange" class="needle">
                    <div class="date-box" id="d-orange"></div>
                    <div class="needle-bar" style="background:#db7c87; color:rgb(255, 255, 255);transform:rotate(180deg);"><div class="text-content">วันหยุดรับประทานยา</div></div>
                </div>
                <div id="n-magenta" class="needle">
                    <div class="date-box" id="d-magenta"></div>
                    <div class="needle-bar" style="background:#8c8383; color:rgb(255, 255, 255);transform:rotate(180deg);"><div class="text-content">วันที่ประจำเดือนกลับมา</div></div>
                </div>
            </div>
            <img id="center-pivot" src="A0B7FD69-E54B-40F6-9EA8-18514D5391A9.png" alt="ศูนย์กลาง">
        </div>
        
    </div>

</div> 

<script>
const svg = document.getElementById('base');
for(let i=0; i<31; i++) {
    let ang = i * (360/31);
    svg.innerHTML += `<line x1="${300+280*Math.cos((ang-90)*Math.PI/180)}" y1="${300+280*Math.sin((ang-90)*Math.PI/180)}" x2="${300+250*Math.cos((ang-90)*Math.PI/180)}" y2="${300+250*Math.sin((ang-90)*Math.PI/180)}" stroke="white" stroke-width="2"/>`;
}

// ฟังก์ชันแปลงวันที่ให้เวลาเป็นเที่ยงคืนตรง เพื่อลดปัญหา Timezone ปัดเศษวันเพี้ยน
function getCleanDate(dateString) {
    if (!dateString) return null;
    let parts = dateString.split('-');
    let d = new Date(parts[0], parts[1] - 1, parts[2]);
    d.setHours(0, 0, 0, 0); 
    return d;
}

function formatDateForInput(d) {
    let month = '' + (d.getMonth() + 1);
    let day = '' + d.getDate();
    let year = d.getFullYear();
    if (month.length < 2) month = '0' + month;
    if (day.length < 2) day = '0' + day;
    return [year, month, day].join('-');
}

function updateTDate() {
    const pInput = document.getElementById('p-date').value;
    const delay = parseInt(document.getElementById('delay-days').value);
    
    if (pInput && !isNaN(delay)) {
        let p = getCleanDate(pInput);
        p.setDate(p.getDate() + delay); 
        document.getElementById('t-date').value = formatDateForInput(p);
    }
}

function updateDelayDays() {
    const pInput = document.getElementById('p-date').value;
    const tInput = document.getElementById('t-date').value;
    
    if (pInput && tInput) {
        let p = getCleanDate(pInput);
        let t = getCleanDate(tInput);
        let diffDays = Math.round((t - p) / 864e5); 
        document.getElementById('delay-days').value = diffDays;
    }
}

function fDate(d) { 
    if(isNaN(d)) return "-";
    return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; 
}

function phase1() {
    const pInput = document.getElementById('p-date').value;
    const tInput = document.getElementById('t-date').value;
    
    if(!pInput || !tInput) {
        return alert("กรุณาใส่วันที่ประจำเดือนมาปกติ และ วันที่อยากให้ประจำเดือนมา ให้ครบก่อนนะคะ");
    }
    
    const p = getCleanDate(pInput);
    const t = getCleanDate(tInput);
    
    const orangeDate = new Date(t);
    orangeDate.setDate(t.getDate() - 2); 
    
    const windowStart = new Date(p);
    windowStart.setDate(p.getDate() - 5);
    const windowEnd = new Date(p);
    windowEnd.setDate(p.getDate() - 3);

    document.getElementById('gold-window').innerText = `ช่วงที่ควรรับประทานยา:\n ${fDate(windowStart)} ถึง ${fDate(windowEnd)}`;
    document.getElementById('p2').style.display = 'block';
    
    document.getElementById('n-green').style.opacity = '1';
    document.getElementById('n-yellow').style.opacity = '1';
    document.getElementById('n-red').style.opacity = '1';
    document.getElementById('n-orange').style.opacity = '1';
    document.getElementById('n-magenta').style.opacity = '1';
    document.getElementById('n-cyan').style.opacity = '0';
    
    // ฟังก์ชันคำนวณส่วนต่างวันให้แม่นยำ
    const getDiff = (d) => Math.round((d.getTime() - p.getTime()) / 864e5);
    
    updateNeedle('n-green', 'd-green', windowStart, -5);
    updateNeedle('n-yellow', 'd-yellow', windowEnd, -3);
    updateNeedle('n-red', 'd-red', p, 0); 
    updateNeedle('n-orange', 'd-orange', orangeDate, getDiff(orangeDate)); 
    updateNeedle('n-magenta', 'd-magenta', t, getDiff(t)); 

    const needlesDiv = document.getElementById('needles');
    needlesDiv.style.transition = "transform 1s ease-out";
    needlesDiv.style.transform = "rotate(720deg)";
    setTimeout(() => { 
        needlesDiv.style.transition = "none";
        needlesDiv.style.transform = "rotate(0deg)"; 
    }, 1000);
}

function phase2() {
    const w = parseFloat(document.getElementById('w').value);
    const pInput = document.getElementById('p-date').value;
    const tInput = document.getElementById('t-date').value;
    const sInput = document.getElementById('s-actual').value;
    
    if(!sInput) {
        alert("กรุณาเลือกวันเริ่มกินยาจริงก่อนนะคะ");
        return;
    }
    
    const p = getCleanDate(pInput);
    const t = getCleanDate(tInput);
    const s = getCleanDate(sInput); 
    
    const orangeDate = new Date(t);
    orangeDate.setDate(t.getDate() - 2); 
    
    const dose = (w >= 60 ? 3 : 2);
    
    let totalDelayDays = 0;
    if (t >= p) {
         totalDelayDays = Math.round((t - p) / 864e5);
    }
    
    let days = 0;
    if (orangeDate >= s) {
        // คำนวณแบบตรงไปตรงมา: วันหยุดยา ลบ วันเริ่มกินยา จะได้จำนวนวันที่ต้องกินพอดี
        // (เช่น เริ่ม 17 หยุด 24 -> 24 - 17 = 7 วัน)
        days = Math.floor((orangeDate.getTime() - s.getTime()) / 864e5); 
    }
    
    let pills = days * dose;

    const limitDate = new Date(p);
    limitDate.setDate(p.getDate() - 3);

    let warningHTML = "";
    
    if (s > limitDate) {
        alert("⚠️ ไม่ทันแล้ว! คนไข้เริ่มรับประทานยาน้อยกว่า 3 วันก่อนประจำเดือนมา ยาอาจไม่มีประสิทธิภาพ");
        warningHTML = `<div class="warning-banner">⚠️ ไม่ทันแล้ว! เริ่มยากระชั้นชิดเกินไป ยาอาจไม่มีประสิทธิภาพ</div>`;
    }
    
    document.getElementById('res').style.display = 'block';
    
    document.getElementById('res').innerHTML = `
        ${warningHTML}
        <div class="res-item" style="background:#e0f2fe; color:#0369a1; font-weight:bold;">สรุป: ต้องการเลื่อนประจำเดือนทั้งหมด ${totalDelayDays} วัน</div>
        <div class="res-item" style="background:#FFFFFF; color:#002d62;"><b>จำนวนวันที่ต้องกินยา:</b> ${days} วัน</div>
        <div class="res-item" style="background:#FFFFFF; color:#002d62;"><b>จำนวนเม็ดยา:</b> ${pills} เม็ด</div>
        <div class="res-item" style="background:#FFFFFF; color:#002d62;"><b>วิธีทาน:</b> ${dose} เม็ด/วัน</div>
        <div class="res-item" style="background:#c8ead1; color:#235D3A; font-size:16px;"><b>วันที่เริ่มกินยาจริง</b>: ${fDate(s)}</div>
        <div class="res-item" style="background:#FFFFFF; color:#002d62; font-size:16px;"><b>วันหยุดยา</b>: ${fDate(orangeDate)}</div>
        <div class="res-item" style="background:#f8bbd0; color:#880e4f; border-bottom:1px solid #ccc; margin-bottom: 0;"><b>วันที่ประจำเดือนจะกลับมา</b>: ${fDate(t)}</div>
    `;
    
    document.getElementById('side-effects-box').style.display = 'block';
    
    document.getElementById('n-green').style.opacity = '0';
    document.getElementById('n-yellow').style.opacity = '0';
    document.getElementById('n-cyan').style.opacity = '1';
    
    const getDiff = (d) => Math.round((d.getTime() - p.getTime()) / 864e5);
    updateNeedle('n-cyan', 'd-cyan', s, getDiff(s)); 
}

function updateNeedle(id, did, d, dayOffset) {
    let angle = dayOffset * (360/31);
    let mainNeedle = document.getElementById(id);
    mainNeedle.style.transform = `rotate(${angle}deg)`;
    
    let dateBox = document.getElementById(did);
    dateBox.innerText = fDate(d);
    dateBox.style.transform = `rotate(${-angle}deg)`; 
    
    let normalizedAngle = ((angle % 360) + 360) % 360;
    
    // ⚡ พลิกแค่กล่องข้อความ .text-content 180 องศา (แท่งไม่ขยับ)
    let textContent = mainNeedle.querySelector('.text-content');
    if (textContent) {
        if (normalizedAngle > 90 && normalizedAngle < 270) {
            textContent.style.transform = "rotate(180deg)"; 
        } else {
            textContent.style.transform = "rotate(0deg)";
        }
    }
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || 
       (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c')) || 
       (e.ctrlKey && (e.key === 'U' || e.key === 'u'))) {
        e.preventDefault();
        return false;
    }
});

['w', 'p-date', 'delay-days', 't-date'].forEach(id => {
    let inputField = document.getElementById(id);
    if (inputField) {
        inputField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                phase1(); 
            }
        });
    }
});

let sActualField = document.getElementById('s-actual');
if (sActualField) {
    sActualField.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            phase2(); 
        }
    });
}
</script>
</body>
</html>
